<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
</head>

    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>

<body>
    <main>
        <div class="accordion">
<!-- Vlees acc-->
            <button class="accordion-title">Vlees</button>
            <div class="accordion-content">
                Patatas met chorizo, albondigas en jamón.
            </div>
<!-- Vis acc-->
            <button class="accordion-title">Vis</button>
            <div class="accordion-content">
                Gambas al ajillo, calamares en ansjovis.
            </div>
<!-- Groentes acc-->
            <button class="accordion-title">Groentes</button>
            <div class="accordion-content">
                Gegrilde groenten, olijven en pimientos de padrón.
            </div>
<!-- Zuivel acc-->
            <button class="accordion-title">Zuivel</button>
            <div class="accordion-content">
                Manchego, geitenkaas en aioli.
            </div>
<!-- Soepen acc-->
            <button class="accordion-title">Soepen</button>
            <div class="accordion-content">
                Gazpacho en romige tomatensoep.
            </div>
<!-- Desserts acc-->
            <button class="accordion-title">Desserts</button>
            <div class="accordion-content">
                Churros, flan en crema catalana.
            </div>
<!-- Sauzen acc-->
            <button class="accordion-title">Sauzen</button>
            <div class="accordion-content">
                Romesco, salsa brava en alioli.
            </div>
<!-- Dranken acc-->
            <button class="accordion-title">Dranken</button>
            <div class="accordion-content">
                Jouw gerechten of specialiteiten.
            </div>

        </div>
    </main>
</body>
</html>
